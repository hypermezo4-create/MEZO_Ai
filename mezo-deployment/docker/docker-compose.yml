version: '3.8'

services:
  frontend:
    build:
      context: ../..
      dockerfile: mezo-deployment/docker/Dockerfile.frontend
    ports:
      - "3000:80"

  backend:
    build:
      context: ../..
      dockerfile: mezo-deployment/docker/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  ai-engine:
    build:
      context: ../..
      dockerfile: mezo-deployment/docker/Dockerfile.ai-engine
    ports:
      - "8000:8000"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mezo_user
      POSTGRES_PASSWORD: mezo_password
      POSTGRES_DB: mezo_db
    ports:
      - "5432:5432"
