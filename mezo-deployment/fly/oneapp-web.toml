app = "mezo-ai"
primary_region = "ord"
[build]
  dockerfile = "../../mezo-control-plane/Dockerfile"
[env]
  MEZO_APP_NAME = "mezo-ai"
  ROUTER_URL = "http://router.process.mezo-ai.internal:8080/v1"
  VALKEY_URL = "redis://queue.process.mezo-ai.internal:6379/0"
[processes]
  web = ""
[checks.http]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"
[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["web"]
[[services.ports]]
  port = 8080
