app = "mezo-router"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "60s"
[build]
  dockerfile = "mezo-router/Dockerfile"
[checks.router]
  type = "http"
  port = 8080
  interval = "20s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/healthz"
[[vm]]
  size = "performance-4x"
  memory = "32gb"
[[restart]]
  policy = "always"
