app = "mezo-backend"
primary_region = "ams"

[build]
  dockerfile = "docker/Dockerfile.backend"

[env]
  PORT = "5000"
  NODE_ENV = "production"

[[services]]
  protocol = "tcp"
  internal_port = 5000
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
