app = "mezo-control-plane"
primary_region = "ams"

[build]
  dockerfile = "../../mezo-control-plane/Dockerfile"

[env]
  PORT = "8080"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8080
    handlers = ["http"]
