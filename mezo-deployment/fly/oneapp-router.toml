app = "mezo-ai"
primary_region = "ord"
[build]
  dockerfile = "../../mezo-router/Dockerfile"
[env]
  MEZO_APP_NAME = "mezo-ai"
[processes]
  router = ""
[checks.http]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
[[vm]]
  size = "performance-4x"
  memory = "32gb"
[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["router"]
[[services.ports]]
  port = 8080
  handlers = ["http"]
