app = "mezo-ai"
primary_region = "ord"
[build]
  dockerfile = "../../mezo-runner/Dockerfile"
[env]
  MEZO_APP_NAME = "mezo-ai"
  MEZO_API_URL = "http://web.process.mezo-ai.internal:8080"
  ROUTER_URL = "http://router.process.mezo-ai.internal:8080/v1"
[processes]
  runner = ""
[mounts]
  source = "mezo_runner_data"
  destination = "/workspaces"
[[vm]]
  size = "performance-8x"
  memory = "64gb"
