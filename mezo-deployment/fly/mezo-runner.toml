app = "mezo-runner"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "mezo-runner/Dockerfile"

[env]
  MEZO_API_URL = "http://mezo-api.internal:8080"
  WORKSPACE_ROOT = "/workspaces"
  RUNNER_DATA_ROOT = "/workspaces/.runner"
  FAILED_WORKSPACE_RETENTION = "delete"
  RUNNER_HEARTBEAT_SECONDS = "10"
  RUNNER_POLL_SECONDS = "2"
  KILO_TASK_TIMEOUT_SECONDS = "3600"

[mounts]
  source = "mezo_runner_data"
  destination = "/workspaces"

[[vm]]
  size = "performance-16x"

[[restart]]
  policy = "always"
