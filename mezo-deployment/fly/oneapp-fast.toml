app = "mezo-ai"
primary_region = "ord"
[build]
  dockerfile = "../../mezo-model-server/Dockerfile"
[env]
  MODEL_MANIFEST = "fast"
  MODEL_CONTEXT = "32768"
[processes]
  fast = ""
[mounts]
  source = "mezo_fast_models"
  destination = "/models"
[checks.model]
  type = "tcp"
  port = 8080
  interval = "20s"
  timeout = "5s"
  grace_period = "2h"
[[vm]]
  size = "performance-8x"
  memory = "64gb"
[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["fast"]
[[services.ports]]
  port = 8080
  handlers = ["http"]
