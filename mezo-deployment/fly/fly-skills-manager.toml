app = "mezo-skills-manager"
primary_region = "ams"

[build]
  dockerfile = "../../mezo-skills-manager/Dockerfile"

[env]
  PORT = "8090"

[[services]]
  protocol = "tcp"
  internal_port = 8090
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8090
    handlers = ["http"]
