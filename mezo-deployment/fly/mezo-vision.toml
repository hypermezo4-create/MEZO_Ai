app = "mezo-vision"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "180s"
[build]
  dockerfile = "mezo-model-server/Dockerfile"
[env]
  MODEL_MANIFEST = "vision"
[mounts]
  source = "mezo_vision_models"
  destination = "/models"
[checks.model]
  type = "tcp"
  port = 8080
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
[[vm]]
  size = "performance-16x"
  memory = "128gb"
[[restart]]
  policy = "always"
