apiVersion: apps/v1
kind: Deployment
metadata:
  name: mezo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mezo-frontend
  template:
    metadata:
      labels:
        app: mezo-frontend
    spec:
      containers:
      - name: frontend
        image: mezo-frontend:latest
        ports:
        - containerPort: 80
