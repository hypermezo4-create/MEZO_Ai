version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: mezo-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: mezo-grafana
    ports:
      - "3001:3000"
