version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mezo-postgres
    environment:
      POSTGRES_USER: mezo_user
      POSTGRES_PASSWORD: mezo_password
      POSTGRES_DB: mezo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schemas:/docker-entrypoint-initdb.d

volumes:
  pgdata:
