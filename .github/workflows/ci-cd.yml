name: MEZO Phase 1 CI

on:
  pull_request:
    branches: [main, feat/mezo-agent-mvp]
  push:
    branches: [main, feat/mezo-agent-mvp]

permissions:
  contents: read

concurrency:
  group: mezo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mezo
          POSTGRES_PASSWORD: mezo-ci-password
          POSTGRES_DB: mezo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mezo -d mezo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      MEZO_TESTING: "1"
      MEZO_ENV: test
      DATABASE_URL: postgresql+psycopg://mezo:mezo-ci-password@localhost:5432/mezo_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      AUDIT_HMAC_KEY: ci-only-audit-key-at-least-32-characters
      MEZO_BOOTSTRAP_TOKEN: ci-bootstrap-token
      RUNNER_REGISTRATION_TOKEN: ci-runner-registration-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mezo-control-plane/requirements.txt
            mezo-control-plane/requirements-dev.txt
      - run: pip install -r mezo-control-plane/requirements-dev.txt
      - name: Apply PostgreSQL migrations
        run: python mezo-database/migrate.py up
      - name: Python static analysis
        run: ruff check --select E9,F63,F7,F82 mezo-control-plane mezo-runner mezo-router
      - name: API tests
        working-directory: mezo-control-plane
        run: pytest -q

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mezo-runner/requirements.txt
      - run: pip install -r mezo-runner/requirements.txt pytest-asyncio==1.1.0
      - name: Runner security tests
        env:
          PYTHONPATH: mezo-runner
        run: pytest -q mezo-runner/tests

  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mezo-router/requirements.txt
      - run: pip install -r mezo-router/requirements.txt pytest==8.4.1
      - name: Router tests
        working-directory: mezo-router
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=mezo-frontend
      - run: npm run test --workspace=mezo-frontend -- --run
      - run: npm run build --workspace=mezo-frontend

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build --workspace=mezo-frontend
      - run: cargo fmt --manifest-path mezo-desktop/src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path mezo-desktop/src-tauri/Cargo.toml

  windows-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build Windows x64 EXE and installer
        run: npm run build --workspace=mezo-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: mezo-windows-x64
          path: |
            mezo-desktop/src-tauri/target/release/*.exe
            mezo-desktop/src-tauri/target/release/bundle/**/*.exe
            mezo-desktop/src-tauri/target/release/bundle/**/*.msi

  containers:
    runs-on: ubuntu-latest
    needs: [api, runner, router, frontend, desktop]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f mezo-control-plane/Dockerfile -t mezo-api:ci .
      - name: Build runner image
        run: docker build -f mezo-runner/Dockerfile -t mezo-runner:ci .
      - name: Build router image
        run: docker build -f mezo-router/Dockerfile -t mezo-router:ci .
      - name: Build indexer image
        run: docker build -f mezo-indexer/Dockerfile -t mezo-indexer:ci .
      - name: Build queue image
        run: docker build -f mezo-queue/Dockerfile -t mezo-queue:ci .
      - name: Build CPU model image
        run: docker build -f mezo-model-server/Dockerfile -t mezo-model:ci .
