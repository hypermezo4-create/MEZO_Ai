name: MEZO AI CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ created ]

jobs:
  test-and-package-backend:
    name: Backend Test & Package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Strict Dependency Audit & Test (mezo-control-plane)
        run: |
          python -m venv venv-cp
          # On Windows runners, use Scripts/activate
          ./venv-cp/Scripts/activate
          pip install -r mezo-control-plane/requirements.txt pytest pytest-asyncio
          pytest mezo-control-plane/tests/
        shell: bash

      - name: Strict Dependency Audit & Test (mezo-security)
        run: |
          python -m venv venv-sec
          ./venv-sec/Scripts/activate
          pip install -r mezo-security/requirements.txt pytest pytest-asyncio
          pytest mezo-security/tests/
        shell: bash

      - name: Strict Dependency Audit & Test (mezo-training)
        run: |
          python -m venv venv-train
          ./venv-train/Scripts/activate
          pip install -r mezo-training/requirements.txt pytest pytest-asyncio
          pytest mezo-training/tests/
        shell: bash

      - name: Install Build Dependencies (PyInstaller)
        run: pip install -r requirements-build.txt

      - name: Build Standalone Executable
        run: |
          pyinstaller --onefile --name mezo-backend mezo_launcher.py

      - name: Upload Backend Executable
        uses: actions/upload-artifact@v4
        with:
          name: mezo-backend-windows
          path: dist/mezo-backend.exe

  build-frontend:
    name: Frontend Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Fail-Fast Dependency Check (npm ci)
        run: npm ci

      - name: Build Frontend
        run: npm run build:web

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mezo-frontend-dist
          path: mezo-frontend/dist/

  build-desktop-windows:
    name: Desktop Build (Windows)
    needs: [test-and-package-backend, build-frontend]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: mezo-frontend-dist
          path: mezo-frontend/dist

      - name: Download Backend Sidecar
        uses: actions/download-artifact@v4
        with:
          name: mezo-backend-windows
          path: mezo-frontend/src-tauri/bin
      
      - name: Rename Sidecar for Tauri
        run: |
          cd mezo-frontend/src-tauri/bin
          mv mezo-backend.exe mezo-backend-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Install Frontend Deps
        run: cd mezo-frontend && npm ci

      - name: Build Tauri
        run: cd mezo-frontend && npx tauri build

      - name: Upload Desktop Installer
        uses: actions/upload-artifact@v4
        with:
          name: mezo-desktop-windows
          path: mezo-frontend/src-tauri/target/release/bundle/msi/*.msi

  deploy-release:
    name: Attach to GitHub Release
    needs: [test-and-package-backend, build-frontend, build-desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - name: Download Backend
        uses: actions/download-artifact@v4
        with:
          name: mezo-backend-windows
          path: ./artifacts

      - name: Download Desktop Installer
        uses: actions/download-artifact@v4
        with:
          name: mezo-desktop-windows
          path: ./artifacts

      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: mezo-frontend-dist
          path: ./artifacts/frontend

      - name: Zip Frontend Dist
        run: |
          cd ./artifacts/frontend
          zip -r ../mezo-frontend-dist.zip .
        shell: bash

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/mezo-backend.exe
            ./artifacts/*.msi
            ./artifacts/mezo-frontend-dist.zip
